[project]
name = "jarvis-pyqt"
version = "0.1.0"
description = "Jarvis desktop app with PyQt6, Arc Reactor HUD, face recognition, TTS/STT"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0",
    "opencv-contrib-python>=4.8.0",
    "pymysql>=1.1.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "sounddevice>=0.4.6",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
# Hands-free wake word (openWakeWord ONNX). Optional — without it the app
# falls back to push-to-talk (mic button).
wakeword = [
    "openwakeword>=0.6.0",
    "onnxruntime>=1.17.0",
]

[project.scripts]
jarvis = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
qt_api = "pyqt6"
