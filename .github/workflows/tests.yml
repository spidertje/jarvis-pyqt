name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      # PyQt6 needs EGL/GL + xcb libs headless; sounddevice needs portaudio.
      # Canonical's default mirrors (ec2/security) intermittently 503 or
      # time out for runners; pin the Azure mirror and retry apt.
      - name: Install system libs
        run: |
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i "s|^URIs: .*|URIs: http://azure.archive.ubuntu.com/ubuntu/|" \
              /etc/apt/sources.list.d/ubuntu.sources
          fi
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i \
              "s|https\?://[a-z0-9.-]*archive.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g; s|https\?://security.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g" \
              /etc/apt/sources.list
          fi
          ok=0
          for i in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends \
              libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
              libportaudio2; then ok=1; break; fi
            echo "apt attempt $i failed — retrying in 15s"
            sleep 15
          done
          [ "$ok" = 1 ]

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -q -p no:cacheprovider
